[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ion-ai"
version = "0.1.0"
description = "PyTorch layers with sparse, self-rewiring connections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "torch>=1.13",
]

[project.optional-dependencies]
data = [
    "datasets>=2.14",
]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["ion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
